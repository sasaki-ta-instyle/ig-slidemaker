    </div>

    <!-- 全スライド共通 chrome -->
    <div class="chrome">
      <div class="progress" id="progress" style="width: 12.5%"></div>
      <div class="brand">
        <img src="https://app.instyle.group/_shared/static/logo.svg" alt="instyle.group">
        <div class="brand-divider"></div>
        <div class="brand-context" id="brandContext">Cover</div>
      </div>
      <div class="deckmark" id="deckmark">Cover</div>
      <div class="counter"><b id="counterNum">01</b> &nbsp;/&nbsp; <span id="counterTotal">08</span></div>
    </div>

  </div>
</div>

<div class="help" id="help">
  <span><kbd>←</kbd><kbd>→</kbd> navigate</span>
  <span><kbd>1</kbd>…<kbd>8</kbd> jump</span>
  <span><kbd>O</kbd> grid</span>
  <span><kbd>V</kbd> scroll</span>
  <span><kbd>F</kbd> fullscreen</span>
</div>

<script>
(() => {
  const deck = document.getElementById('deck');
  const track = document.getElementById('track');
  const progress = document.getElementById('progress');
  const counterNum = document.getElementById('counterNum');
  const counterTotal = document.getElementById('counterTotal');
  const deckmark = document.getElementById('deckmark');
  const brandContext = document.getElementById('brandContext');

  const stage = document.querySelector('.stage');
  const slides = Array.from(track.querySelectorAll('.slide'));
  const total = slides.length;
  let current = 0;
  let overview = false;
  let vertical = false;

  counterTotal.textContent = String(total).padStart(2, '0');

  function fitStage() {
    const sw = window.innerWidth;
    const sh = window.innerHeight;
    const scale = Math.min(sw / 1366, sh / 900);
    deck.style.transform = `scale(${scale})`;
  }

  function applyChrome(i) {
    const s = slides[i];
    const isDark = s.dataset.dark === 'true';
    deck.classList.toggle('is-dark', isDark);
    counterNum.textContent = String(i + 1).padStart(2, '0');
    deckmark.textContent = s.dataset.mark || '';
    brandContext.textContent = s.dataset.name || '';
    progress.style.width = `${((i + 1) / total) * 100}%`;
    slides.forEach((sl, idx) => sl.classList.toggle('is-current', idx === i));
  }

  function go(i) {
    current = Math.max(0, Math.min(total - 1, i));
    if (!overview) {
      track.style.transform = `translateX(${-current * 1366}px)`;
    }
    applyChrome(current);
  }

  function toggleOverview() {
    if (vertical) toggleVertical();
    overview = !overview;
    deck.classList.toggle('is-overview', overview);
    if (overview) {
      track.style.transform = 'none';
    } else {
      go(current);
    }
  }

  function toggleVertical() {
    if (overview) {
      overview = false;
      deck.classList.remove('is-overview');
    }
    vertical = !vertical;
    deck.classList.toggle('is-vertical', vertical);
    stage.classList.toggle('is-scrolling', vertical);
    if (vertical) {
      track.style.transform = 'none';
      deck.style.transform = 'none';
      // 現在のスライドへスクロール
      requestAnimationFrame(() => {
        slides[current]?.scrollIntoView({ behavior: 'auto', block: 'start' });
      });
    } else {
      fitStage();
      go(current);
    }
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.();
      document.body.classList.add('is-presenting');
    } else {
      document.exitFullscreen?.();
      document.body.classList.remove('is-presenting');
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Escape') {
      if (overview) { toggleOverview(); return; }
      if (vertical) { toggleVertical(); return; }
    }
    if (vertical) {
      // 縦スクロール時は矢印・1-8 で該当スライドへスクロール、ESC / V で戻る
      if (/^[1-9]$/.test(e.key)) {
        const n = Number(e.key) - 1;
        if (n < total) slides[n].scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      if (e.key.toLowerCase() === 'v') { toggleVertical(); return; }
      return;  // 矢印などは native スクロールに任せる
    }
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(current + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(current - 1); }
    else if (e.key === 'Home') { go(0); }
    else if (e.key === 'End') { go(total - 1); }
    else if (/^[1-9]$/.test(e.key)) { const n = Number(e.key) - 1; if (n < total) go(n); }
    else if (e.key.toLowerCase() === 'o') { toggleOverview(); }
    else if (e.key.toLowerCase() === 'v') { toggleVertical(); }
    else if (e.key.toLowerCase() === 'f') { toggleFullscreen(); }
  });

  document.querySelector('.stage').addEventListener('click', (e) => {
    if (overview) {
      const target = e.target.closest('.slide');
      if (target) { const idx = slides.indexOf(target); if (idx >= 0) { toggleOverview(); go(idx); } }
      return;
    }
    const x = e.clientX / window.innerWidth;
    if (x > 0.5) go(current + 1); else go(current - 1);
  });

  let touchStartX = null;
  document.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (touchStartX == null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 60) { if (dx < 0) go(current + 1); else go(current - 1); }
    touchStartX = null;
  });

  window.addEventListener('resize', fitStage);
  fitStage();

  const hashMatch = location.hash.match(/^#(\d+)$/);
  const initial = hashMatch ? Math.max(1, Math.min(total, Number(hashMatch[1]))) - 1 : 0;
  go(initial);
})();
</script>

</body>
</html>
