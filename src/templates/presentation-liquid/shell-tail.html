  </main>
</div>

<div class="click-zone prev" aria-hidden="true"></div>
<div class="click-zone next" aria-hidden="true"></div>

<div class="deck-chrome">
  <span class="deck-chrome__spacer" aria-hidden="true"></span>
  <div class="pill" role="toolbar" aria-label="スライド操作">
    <button type="button" class="pill-action" id="navPrev" aria-label="前へ" aria-keyshortcuts="ArrowLeft">
      <span class="key" aria-hidden="true">←</span><span>戻る</span>
    </button>
    <span class="sep"></span>
    <button type="button" class="pill-action" id="navNext" aria-label="次へ" aria-keyshortcuts="ArrowRight Space">
      <span class="key" aria-hidden="true">→</span><span>進む</span>
    </button>
    <span class="sep"></span>
    <button type="button" class="pill-action" id="navFs" aria-label="全画面" aria-keyshortcuts="F">
      <span class="key" aria-hidden="true">F</span><span>全画面</span>
    </button>
    <span class="sep--group" aria-hidden="true"></span>
    <button type="button" class="pill-action" id="navPrint" aria-label="PDF" aria-keyshortcuts="P">
      <span class="key" aria-hidden="true">P</span><span>PDF</span>
    </button>
    <span class="sep"></span>
    <button type="button" class="pill-action is-ov" id="ovBtn" aria-label="一覧" aria-keyshortcuts="V" aria-pressed="false">
      <span class="pill-icon" id="ovIcon" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="4.5" height="4.5" rx="0.6" stroke="currentColor" stroke-width="1.5"/><rect x="9.5" y="2" width="4.5" height="4.5" rx="0.6" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="9.5" width="4.5" height="4.5" rx="0.6" stroke="currentColor" stroke-width="1.5"/><rect x="9.5" y="9.5" width="4.5" height="4.5" rx="0.6" stroke="currentColor" stroke-width="1.5"/></svg></span>
      <span id="ovLabel">一覧</span>
    </button>
  </div>
  <span class="deck-chrome__spacer" aria-hidden="true"></span>
</div>

<script>
(() => {
  const SLIDE_W = 1366, SLIDE_H = 900;
  const deck = document.getElementById('deck');
  const slides = [...deck.querySelectorAll('.slide')];
  const total = slides.length;

  // Fit-to-window scaling（上下の chrome の高さぶん余白）
  const isOverview = () => document.body.classList.contains('is-overview');
  const fit = () => {
    if (isOverview()) {
      deck.style.transform = '';
      const vw = window.innerWidth - 48;
      deck.style.zoom = String(Math.min(0.85, Math.max(0.22, vw / SLIDE_W)));
      return;
    }
    deck.style.zoom = '';
    const vw = window.innerWidth - 32;
    const vh = window.innerHeight - 96;
    const s = Math.min(1.5, vw / SLIDE_W, vh / SLIDE_H);
    deck.style.transform = `scale(${s})`;
  };
  window.addEventListener('resize', fit);
  fit();

  // Inject per-slide page numbers (skip the cover)
  slides.forEach((slide, i) => {
    if (slide.dataset.slide === 'cover') return;
    const tag = document.createElement('span');
    tag.className = 'slide__page-num';
    tag.setAttribute('aria-hidden', 'true');
    tag.textContent = String(i + 1).padStart(2, '0');
    slide.appendChild(tag);
  });

  // Header progress bar (click-to-seek)
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  if (progressBar) {
    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      if (rect.width <= 0) return;
      const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      show(Math.round(ratio * (total - 1)));
    });
  }

  // Navigation
  let idx = 0;
  const show = (n) => {
    idx = Math.max(0, Math.min(total - 1, n));
    slides.forEach((el, i) => el.classList.toggle('is-active', i === idx));
    const pct = total > 1 ? (idx / (total - 1)) * 100 : 100;
    if (progressFill) progressFill.style.width = pct + '%';
    if (progressBar) progressBar.setAttribute('aria-valuenow', String(Math.round(pct)));
    if (history.replaceState) history.replaceState(null, '', '#' + (idx + 1));
    if (isOverview()) {
      slides[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  };

  // Overview toggle
  const ovBtn = document.getElementById('ovBtn');
  const setOverview = (on) => {
    document.body.classList.toggle('is-overview', on);
    ovBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    document.getElementById('ovLabel').textContent = on ? '戻る' : '一覧';
    const ovIcon = document.getElementById('ovIcon');
    if (ovIcon) {
      ovIcon.innerHTML = on
        ? '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M9.5 3.5L5 8l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        : '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="4.5" height="4.5" rx="0.6" stroke="currentColor" stroke-width="1.5"/><rect x="9.5" y="2" width="4.5" height="4.5" rx="0.6" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="9.5" width="4.5" height="4.5" rx="0.6" stroke="currentColor" stroke-width="1.5"/><rect x="9.5" y="9.5" width="4.5" height="4.5" rx="0.6" stroke="currentColor" stroke-width="1.5"/></svg>';
    }
    fit();
    if (on) {
      // overview 突入時、現在スライドを中央に
      requestAnimationFrame(() => slides[idx].scrollIntoView({ block: 'center' }));
    } else {
      window.scrollTo(0, 0);
    }
  };
  const toggleOverview = () => setOverview(!isOverview());
  ovBtn.addEventListener('click', toggleOverview);

  // overview 中、スライドクリックでそのスライドにジャンプして単一表示へ
  slides.forEach((slide, i) => {
    slide.addEventListener('click', () => {
      if (!isOverview()) return;
      setOverview(false);
      show(i);
    });
  });
  const next = () => show(idx + 1);
  const prev = () => show(idx - 1);

  // Restore from hash (or initialize to first slide)
  const fromHash = parseInt((location.hash || '').replace('#', ''), 10);
  if (!Number.isNaN(fromHash) && fromHash >= 1 && fromHash <= total) show(fromHash - 1);
  else show(0);

  window.addEventListener('hashchange', () => {
    const n = parseInt((location.hash || '').replace('#', ''), 10);
    if (!Number.isNaN(n)) show(n - 1);
  });

  // Keyboard
  window.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    switch (e.key) {
      case 'ArrowRight': case ' ': case 'PageDown': case 'Enter': next(); e.preventDefault(); break;
      case 'ArrowLeft':  case 'PageUp': case 'Backspace':       prev(); e.preventDefault(); break;
      case 'Home': show(0); e.preventDefault(); break;
      case 'End':  show(total - 1); e.preventDefault(); break;
      case 'f': case 'F': toggleFs(); e.preventDefault(); break;
      case 'v': case 'V': toggleOverview(); e.preventDefault(); break;
      case 'Escape': if (isOverview()) { setOverview(false); e.preventDefault(); } break;
      case 'p': case 'P': if (!e.metaKey && !e.ctrlKey) { window.print(); e.preventDefault(); } break;
    }
  });

  // Click zones
  document.querySelector('.click-zone.next').addEventListener('click', next);
  document.querySelector('.click-zone.prev').addEventListener('click', prev);

  // Footer pill actions
  document.getElementById('navPrev').addEventListener('click', prev);
  document.getElementById('navNext').addEventListener('click', next);
  document.getElementById('navFs').addEventListener('click', toggleFs);
  document.getElementById('navPrint').addEventListener('click', () => window.print());

  // Touch swipe
  let tx = null;
  window.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; }, { passive: true });
  window.addEventListener('touchend', (e) => {
    if (tx === null) return;
    const dx = (e.changedTouches[0].clientX - tx);
    if (Math.abs(dx) > 60) (dx < 0 ? next() : prev());
    tx = null;
  }, { passive: true });

  // Fullscreen
  function toggleFs() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
})();
</script>

</body>
</html>
