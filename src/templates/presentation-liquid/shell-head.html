<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#EDE9E0" />
<title>Slides</title>

<link rel="icon" type="image/png" href="https://app.instyle.group/_shared/static/favicon.png" />

<!-- Gen Interface JP（和文・欧文 1 ファミリ・Display 含む / 8 weights） -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gen-interface-jp@0.5.0/all.css" />

<style>
/* ─────────────────────────────────────────────
   instyle.group / Liquid Glass — Slide Template
   設計基準 viewport: 1366 × 900（iPad Pro 12.9 横）
   ───────────────────────────────────────────── */

:root {
  --color-bg:        #EDE9E0;
  --color-surface:   #F3F1EE;
  --color-surface-2: #E6E2D7;
  --color-surface-3: #E1DCD0;

  --color-text:       #35362D;
  --color-text-muted: #82837A;
  --color-text-light: #C4C1B0;
  --color-text-inv:   #F3F1EE;

  --color-success:   #7BB785;
  --color-warning:   #D4772C;
  --color-error:     #C6292C;
  --color-info:      #38537B;
  --color-highlight: #E2DD2A;

  --glass-light:  rgba(255,255,255,0.55);
  --glass-warm:   rgba(243,241,238,0.58);
  --glass-tinted: rgba(196,193,176,0.42);
  --glass-dark:   rgba( 32, 33, 26,0.78);

  --glass-border-l: rgba(255,255,255,0.80);
  --glass-border-w: rgba(255,255,255,0.62);
  --glass-border-d: rgba(255,255,255,0.13);

  --glass-blur-sm: saturate(180%) blur(16px);
  --glass-blur:    saturate(200%) blur(24px);
  --glass-blur-lg: saturate(220%) blur(40px);

  --glass-shadow-sm: 0 2px 12px rgba(53,54,45,.09), 0 1px 4px rgba(53,54,45,.07);
  --glass-shadow:    0 8px 32px rgba(53,54,45,.11), 0 2px 8px rgba(53,54,45,.08);
  --glass-shadow-lg: 0 20px 64px rgba(53,54,45,.16), 0 4px 16px rgba(53,54,45,.10);

  --glass-hl:   inset 0 1px 0 rgba(255,255,255,.90), inset 0 -1px 0 rgba(0,0,0,.055);
  --glass-hl-d: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(0,0,0,.22);

  --r-sm: 10px;
  --r:    16px;
  --r-lg: 24px;
  --r-xl: 32px;
  --r-pill: 999px;

  --corner-shape:      superellipse(2.5);
  --corner-shape-soft: superellipse(2);
  --corner-shape-hard: superellipse(3.5);

  --font-sans:    'Gen Interface JP', system-ui, sans-serif;
  --font-display: 'Gen Interface JP Display', 'Gen Interface JP', system-ui, sans-serif;

  --ease-out:    250ms cubic-bezier(.4, 0, .2, 1);
  --ease-spring: 380ms cubic-bezier(.34, 1.56, .64, 1);

  --slide-w: 1366px;
  --slide-h: 900px;
}

* { box-sizing: border-box; corner-shape: var(--corner-shape); }
.slide, .glass-panel, .canon-slide { corner-shape: var(--corner-shape-hard); }

html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.6;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}

/* ── Ambient scene 背景 ─────────────────── */
.scene-bg {
  position: fixed; inset: 0; z-index: 0;
  background: var(--color-bg);
  overflow: hidden; pointer-events: none;
}
.scene-bg::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 72% 65% at  8%  6%, rgba(196,193,176,.58) 0%, transparent 55%),
    radial-gradient(ellipse 55% 55% at 94% 10%, rgba(230,226,215,.65) 0%, transparent 52%),
    radial-gradient(ellipse 52% 68% at 78% 88%, rgba(196,193,176,.42) 0%, transparent 55%),
    radial-gradient(ellipse 66% 46% at 18% 92%, rgba(230,226,215,.52) 0%, transparent 55%),
    radial-gradient(ellipse 42% 42% at 50% 48%, rgba(243,241,238,.32) 0%, transparent 52%);
}

/* ── Deck / Stage ──────────────────────── */
.stage {
  position: fixed; inset: 0; z-index: 1;
  display: grid; place-items: center;
  height: 100dvh;
}
.deck {
  position: relative;
  width: var(--slide-w);
  height: var(--slide-h);
  transform-origin: center center;
  /* JS で scale を当てる */
}

/* ── Slide 基本 ────────────────────────── */
.slide {
  position: absolute; inset: 0;
  display: none;
  padding: 88px 96px 104px;
  background: rgba(243,241,238,.50);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border-w);
  box-shadow: var(--glass-hl), var(--glass-shadow-lg);
  border-radius: var(--r-xl);
  overflow: hidden;
}
.slide.is-active { display: block; }
.slide::before {
  content: ''; position: absolute; top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.85) 50%, transparent);
  pointer-events: none;
}

/* ── Typography helpers ─────────────────── */
.eyebrow {
  font-family: var(--font-sans);
  font-size: 0.6875rem;       /* 11px */
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--color-text-muted);
}
.t-display { font-family: var(--font-display); font-size: 59px; font-weight: 200; line-height: 1.04; letter-spacing: -0.012em; }
.t-h1      { font-family: var(--font-display); font-size: 44px; font-weight: 300; line-height: 1.12; letter-spacing: -0.008em; }
.t-h2      { font-family: var(--font-display); font-size: 33px; font-weight: 400; line-height: 1.20; }
.t-h3      { font-family: var(--font-sans);    font-size: 25px; font-weight: 500; line-height: 1.30; }
.t-h4      { font-family: var(--font-sans);    font-size: 19px; font-weight: 500; line-height: 1.45; }
.t-body    { font-family: var(--font-sans);    font-size: 14px; font-weight: 400; line-height: 1.70; }
.t-small   { font-family: var(--font-sans);    font-size: 11px; font-weight: 400; color: var(--color-text-muted); }
.muted     { color: var(--color-text-muted); }
.light     { color: var(--color-text-light); }

mark, .mark {
  background: linear-gradient(180deg, transparent 60%, var(--color-highlight) 60%);
  padding: 0 2px;
  color: inherit;
}
/* 見出しに当てる mark は帯を細く（学生ノート感を避ける）*/
h1 mark, h2 mark, h3 mark,
.t-display mark, .t-h1 mark, .t-h2 mark, .t-h3 mark {
  background: linear-gradient(180deg, transparent 70%, var(--color-highlight) 70%);
}

/* ── Slide: Title ──────────────────────── */
.slide--cover {
  display: none;
  background: rgba(243,241,238,.42);
}
.slide--cover.is-active { display: grid; }
.slide--cover {
  grid-template-rows: auto 1fr auto;
  gap: 32px;
}
.slide--cover .title-top  { display: flex; justify-content: space-between; align-items: center; }
.slide--cover .title-main { align-self: center; max-width: 980px; }
.slide--cover .title-main .lede { margin-top: 24px; color: var(--color-text-muted); max-width: 760px; }
.slide--cover .title-foot { display: flex; justify-content: space-between; align-items: flex-end; }
.slide--cover .title-meta { display: grid; gap: 4px; }
.slide--cover .glow {
  position: absolute; pointer-events: none;
  width: 760px; height: 760px;
  right: -180px; top: -240px;
  background: radial-gradient(ellipse, rgba(226,221,42,.10) 0%, transparent 60%);
  filter: blur(40px);
  z-index: 0;
}

/* ── Slide: Agenda ─────────────────────── */
.slide--agenda { display: none; }
.slide--agenda.is-active { display: grid; }
.slide--agenda {
  grid-template-rows: auto auto;
  align-content: center;
  gap: 36px;
}
.agenda-head { display: flex; justify-content: space-between; align-items: baseline; }
.agenda-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 32px; align-content: start; }
.agenda-item {
  display: grid; grid-template-columns: 72px 1fr; align-items: center;
  gap: 20px; padding: 22px 28px;
  background: rgba(243,241,238,.56);
  backdrop-filter: var(--glass-blur-sm);
  -webkit-backdrop-filter: var(--glass-blur-sm);
  border: 1px solid rgba(255,255,255,.72);
  box-shadow: var(--glass-hl), var(--glass-shadow-sm);
  border-radius: var(--r);
  position: relative; overflow: hidden;
}
.agenda-item::before {
  content: ''; position: absolute; top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.88) 50%, transparent);
}
.agenda-num {
  font-family: var(--font-display);
  font-size: 33px; font-weight: 300;
  color: var(--color-text-light);
  letter-spacing: -0.01em;
}
.agenda-title { display: grid; gap: 2px; }
.agenda-title .t-h3 { font-weight: 500; }
.agenda-title .t-small { color: var(--color-text-muted); }

/* ── Slide: Section divider ────────────── */
.slide--section { display: none; }
.slide--section.is-active { display: grid; }
.slide--section {
  grid-template-rows: 1fr;
  padding: 88px 22.2% 104px 11.1%;
  background: rgba(243,241,238,.58);
}
.section-inner { align-self: center; }
.section-num {
  font-family: var(--font-display);
  font-size: 88px; font-weight: 300;
  color: var(--color-text-light);
  line-height: 1; letter-spacing: -0.02em;
  margin-bottom: 24px;
}
.section-title { max-width: 720px; }
.section-lede { margin-top: 16px; color: var(--color-text-muted); max-width: 540px; }

/* ── Slide: Body ───────────────────────── */
.slide--body { display: none; }
.slide--body.is-active { display: grid; }
.slide--body {
  grid-template-columns: minmax(320px, 380px) 1fr;
  grid-template-rows: auto auto;
  align-content: center;
  column-gap: 56px;
  row-gap: 32px;
}
.body-head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; }

/* ── Slide source（基本は右下） ────────── */
.slide-source {
  position: absolute;
  right: 56px;
  bottom: 56px;
  font-size: 11px;
  color: var(--color-text-muted);
  letter-spacing: 0.02em;
  z-index: 2;
}
.body-left { display: grid; gap: 16px; align-content: start; }
.body-left .lede { color: var(--color-text-muted); }
.body-right { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-content: start; }

.card {
  background: rgba(243,241,238,.56);
  backdrop-filter: var(--glass-blur-sm);
  -webkit-backdrop-filter: var(--glass-blur-sm);
  border: 1px solid rgba(255,255,255,.72);
  box-shadow: var(--glass-hl), var(--glass-shadow-sm);
  border-radius: var(--r);
  padding: 24px;
  position: relative; overflow: hidden;
  display: grid; gap: 12px; align-content: start;
  transition: transform var(--ease-out), box-shadow var(--ease-out);
}
.card::before {
  content: ''; position: absolute; top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.88) 50%, transparent);
}
.card .num {
  font-family: var(--font-display);
  font-size: 33px; font-weight: 300;
  color: var(--color-text-light); line-height: 1;
}
.card .label { font-weight: 600; font-size: 15px; }
.card .desc  { color: var(--color-text-muted); font-size: 13px; line-height: 1.65; }

/* ── Slide: Image Figure（1 枚を主役に） ── */
.slide--image-figure { display: none; }
.slide--image-figure.is-active { display: grid; }
.slide--image-figure {
  grid-template-rows: auto 1fr;
  gap: 28px;
}
.figure-head { display: flex; justify-content: space-between; align-items: baseline; }
.figure-main {
  display: grid;
  grid-template-columns: 1fr minmax(260px, 320px);
  gap: 28px;
  min-height: 0;
}
.figure-frame {
  background: rgba(243,241,238,.56);
  backdrop-filter: var(--glass-blur-sm);
  -webkit-backdrop-filter: var(--glass-blur-sm);
  border: 1px solid rgba(255,255,255,.72);
  box-shadow: var(--glass-hl), var(--glass-shadow);
  border-radius: var(--r);
  padding: 16px;
  display: grid; place-items: center;
  overflow: hidden;
  position: relative;
  min-height: 0;
}
.figure-frame::before {
  content: ''; position: absolute; top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.88) 50%, transparent);
}
.figure-frame img {
  max-width: 100%; max-height: 100%;
  width: auto; height: auto;
  object-fit: contain;
  display: block;
  border-radius: var(--r-sm);
}
.figure-aside { display: grid; gap: 12px; align-content: start; }
.figure-aside .lede { color: var(--color-text-muted); }

/* ── Slide: Image Grid（2×2 の参考画像） ── */
.slide--image-grid { display: none; }
.slide--image-grid.is-active { display: grid; }
.slide--image-grid {
  grid-template-rows: auto 1fr;
  gap: 28px;
}
.grid-head { display: flex; justify-content: space-between; align-items: baseline; }
.image-grid {
  list-style: none; padding: 0; margin: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 20px;
  min-height: 0;
}
.image-grid__item {
  background: rgba(243,241,238,.56);
  backdrop-filter: var(--glass-blur-sm);
  -webkit-backdrop-filter: var(--glass-blur-sm);
  border: 1px solid rgba(255,255,255,.72);
  box-shadow: var(--glass-hl), var(--glass-shadow-sm);
  border-radius: var(--r);
  padding: 14px;
  display: grid; grid-template-rows: 1fr auto; gap: 10px;
  position: relative;
  overflow: hidden;
  min-height: 0;
}
.image-grid__item::before {
  content: ''; position: absolute; top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.88) 50%, transparent);
}
.image-grid__frame {
  min-height: 0;
  overflow: hidden;
  border-radius: var(--r-sm);
  background: rgba(0,0,0,.04);
}
.image-grid__frame img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.image-grid__item .t-small { color: var(--color-text-muted); }

/* ── Logo ──────────────────────────────── */
.brand {
  display: inline-flex; align-items: center; gap: 8px;
  color: var(--color-text-muted);
}
.brand img { height: 14px; width: auto; display: block; opacity: 0.85; }
.brand--lg img { height: 18px; }

/* ── Deck chrome (header / footer) ─────── */
.deck-chrome {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 10;
  padding: 14px 28px calc(14px + env(safe-area-inset-bottom));
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  font-size: 11px; color: var(--color-text-muted);
  pointer-events: none;
}
.deck-chrome__spacer { display: block; }
.deck-chrome > .pill.is-count { justify-self: end; }
.deck-chrome--top {
  top: 0; bottom: auto;
  padding: 0;
  height: 4px;
  display: block;
  z-index: 11;
}
.pill-action {
  font: inherit;
  color: var(--color-text-muted);
  background: none;
  border: 0;
  padding: 10px 10px;
  margin: 0;
  cursor: pointer;
  letter-spacing: 0.04em;
  display: inline-flex; align-items: center; gap: 8px;
  border-radius: 8px;
  min-height: 36px;
}
.pill-action:hover { color: var(--color-text); background: rgba(255,255,255,.42); }
.pill-action:focus-visible { outline: 1px solid var(--color-text); outline-offset: 2px; }
.pill-action.is-ov { color: var(--color-text-muted); font-weight: inherit; letter-spacing: 0.04em; }
.pill-icon { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; color: currentColor; flex: 0 0 auto; }
.sep--group { width: 1px; height: 14px; background: rgba(0,0,0,.18); display: inline-block; margin: 0 4px; }
.deck-chrome .pill {
  pointer-events: auto;
  background: var(--glass-warm);
  backdrop-filter: var(--glass-blur-sm);
  -webkit-backdrop-filter: var(--glass-blur-sm);
  border: 1px solid rgba(255,255,255,.78);
  box-shadow: var(--glass-hl), var(--glass-shadow-sm);
  border-radius: var(--r-pill);
  padding: 4px 14px;
  display: inline-flex; align-items: center; gap: 6px;
  letter-spacing: 0.04em;
  min-height: 44px;
}
.deck-chrome button.pill {
  font: inherit; color: var(--color-text); cursor: pointer;
}
.deck-chrome button.pill:hover { transform: translateY(-1px); }
.deck-chrome .pill .sep { width: 1px; height: 12px; background: rgba(0,0,0,.10); display: inline-block; }
.deck-chrome .pill .key { font-family: ui-monospace, Menlo, monospace; color: var(--color-text-muted); font-size: 10px; }

/* ── Footer pill: dark variant ─────────── */
.deck-chrome:not(.deck-chrome--top) .pill {
  background: rgba(40, 38, 32, .58);
  border-color: rgba(255,255,255,.10);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 4px 14px rgba(0,0,0,.18);
  color: rgba(255,255,255,.88);
}
.deck-chrome:not(.deck-chrome--top) .pill-action {
  color: rgba(255,255,255,.66);
}
.deck-chrome:not(.deck-chrome--top) .pill-action:hover {
  color: #fff;
  background: rgba(255,255,255,.10);
}
.deck-chrome:not(.deck-chrome--top) .pill-action:focus-visible {
  outline-color: rgba(255,255,255,.85);
}
.deck-chrome:not(.deck-chrome--top) .pill-action.is-ov { color: rgba(255,255,255,.66); }
.deck-chrome:not(.deck-chrome--top) .pill .key { color: rgba(255,255,255,.55); }
.deck-chrome:not(.deck-chrome--top) .pill .sep { background: rgba(255,255,255,.16); }
.deck-chrome:not(.deck-chrome--top) .pill .sep--group { background: rgba(255,255,255,.28); }

/* ── Progress bar (header band meter) ─── */
.progress-bar {
  position: relative;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, .06);
  cursor: pointer;
  pointer-events: auto;
}
.progress-bar__fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0%;
  background: var(--color-text);
  transition: width var(--ease-out, 220ms ease);
}

/* ── Page number (inside each slide) ───── */
.slide__page-num {
  position: absolute;
  right: 20px;
  bottom: 14px;
  font-family: var(--font-display);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.06em;
  color: var(--color-text-muted);
  pointer-events: none;
  z-index: 2;
}

@media (max-width: 900px) {
  /* フッターは key と icon だけにしてテキストラベルを隠す */
  .pill-action span:not(.key):not(.pill-icon):not(#ovLabel) { display: none; }
  .deck-chrome .pill { padding: 4px 10px; gap: 4px; }
  .pill-action { padding: 10px 10px; gap: 6px; }
  #ovLabel { display: none; }
}
@media (max-width: 640px) {
  /* さらに狭い投影 / モバイル: navFs と navPrint を隠し、3 ボタン (戻る / 進む / 一覧) のみ */
  #navFs, #navPrint, .sep--group { display: none; }
  .deck-chrome .pill { padding: 4px 6px; }
  .pill-action { padding: 12px 10px; min-width: 44px; justify-content: center; }
}

/* ── Section badge ─────────────────────── */
.badge {
  display: inline-flex; align-items: center;
  padding: 0;
  background: none;
  border: 0;
  border-radius: 0;
  font-family: var(--font-display);
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--color-text-light);
  font-variant-numeric: tabular-nums;
}

/* ── Overview mode（一覧） ──────────────── */
body.is-overview { overflow: hidden auto; }
body.is-overview .stage {
  position: static !important;
  height: auto !important;
  display: block !important;
  padding: 96px 0 112px;
}
body.is-overview .deck {
  transform: none !important;
  width: var(--slide-w);
  height: auto !important;
  margin: 0 auto;
  display: grid;
  gap: 36px;
  /* zoom は JS でウィンドウ幅に応じて再計算 */
}
body.is-overview .slide {
  display: grid !important;
  position: relative !important;
  inset: auto !important;
  width: var(--slide-w);
  height: var(--slide-h);
  margin: 0;
  cursor: pointer;
}
body.is-overview .click-zone { display: none; }

/* ── Click hint zones ──────────────────── */
.click-zone { position: fixed; top: 0; bottom: 60px; width: 30vw; z-index: 5; cursor: w-resize; }
.click-zone.prev { left: 0; }
.click-zone.next { right: 0; cursor: e-resize; }

/* ── Fallback: backdrop-filter なし ─────── */
@supports not (backdrop-filter: blur(1px)) {
  .slide, .agenda-item, .card, .deck-chrome .pill { background: var(--color-surface); }
}

/* ── Print (1 page = 1 slide) ──────────── */
@media print {
  @page { size: 1366px 900px; margin: 0; }
  html, body { overflow: visible; height: auto; background: #fff; }
  .scene-bg, .deck-chrome, .click-zone { display: none !important; }
  .stage { position: static; height: auto; display: block; }
  .deck { transform: none !important; width: 1366px; height: auto; }
  .slide {
